edition = "2026";
package spec;

import "google/protobuf/json_enumvalue_options.proto";

// Custom JSON names on enum values via the option (pb.enumvalue.json).string
enum JsonEnumNamesSeason {
  JSON_ENUM_NAMES_SEASON_UNSPECIFIED = 0;
  JSON_ENUM_NAMES_SEASON_SPRING = 1 [(pb.enumvalue.json).string = "primavera"];
  JSON_ENUM_NAMES_SEASON_SUMMER = 2 [(pb.enumvalue.json).string = "estate"];
  JSON_ENUM_NAMES_SEASON_FALL = 3;
}

message JsonEnumNamesMessage {
  JsonEnumNamesSeason season_field = 1;
  repeated JsonEnumNamesSeason repeated_field = 2;
  map<string, JsonEnumNamesSeason> map_field = 3;
}
